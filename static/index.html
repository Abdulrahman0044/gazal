<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gazal</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div id="workspaceLoading" class="workspace-loading" role="status" aria-live="polite"><img src="/static/brand/gazal-logo.svg" alt="GAZAL."><p>Loading your workspace…</p></div>
<div id="login" class="login-wrap" hidden><form id="loginForm" class="login-panel"><img src="/static/brand/gazal-logo.svg" alt="GAZAL." class="gazal-wordmark"><h1>Gazal</h1><p id="loginSubtitle">Your team. Your projects. One clear workspace.</p><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in →</button><small>One account for your team and workspace.</small><div class="error" id="loginError"></div></form></div>
<div id="app" class="sidebar-open" hidden><div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div><aside id="sidebar" class="sidebar"><div class="brand"><img src="/static/brand/gazal-logo.svg" alt="GAZAL." class="gazal-wordmark"><small>WORK & GROWTH</small></div><div class="side-label">CURRENT ACCOUNT</div><select id="accountSelect"></select><div class="side-label">WORKSPACE</div><nav id="nav"><button data-view="dashboard" class="active">▦ <span>Overview</span></button><button data-view="workday">◷ <span>My Workday</span></button><button data-view="remote">◎ <span>Remote Team</span></button><button data-view="tasks">☷ <span>Tasks</span></button><button data-view="projects">▣ <span>Projects</span></button><button data-view="employees">♙ <span>People</span></button><button data-view="traction">↗ <span>Product traction</span></button><button data-view="sources">⇄ <span>Data sources</span></button><button data-view="performance">◴ <span>Performance</span></button></nav><div class="sidebar-bottom"><span id="username"></span><button id="logout">Sign out</button></div></aside><main><div class="workspace-top"><div class="workspace-brand"><button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Close navigation" aria-expanded="true" aria-controls="sidebar"><span></span><span></span><span></span></button><span>PromptTo workspace <span class="online-dot">●</span></span></div><div class="notification-anchor"><button id="notificationToggle" class="secondary" aria-expanded="false" aria-controls="notificationDropdown">♧ Notifications <span id="unreadBadge"></span> <span id="notificationChevron">⌄</span></button><section id="notificationDropdown" class="notification-dropdown" aria-label="Notifications" hidden><div class="dropdown-head"><h2>Notifications</h2><button id="closeNotifications" class="icon-btn" aria-label="Close notifications">×</button></div><div id="notificationList"></div></section></div></div><header><div><div class="eyebrow">GAZAL / <span id="breadcrumb">OVERVIEW</span></div><h1 id="pageTitle">Business overview</h1><p id="pageSub">Monitor delivery across your account</p></div><button id="topAction" class="primary" hidden>+ Add</button></header><div id="content"></div></main></div>
<dialog id="modal"><form id="modalForm"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" id="closeModal" class="icon-btn">✕</button></div><div id="modalFields"></div><div class="modal-actions"><button type="button" id="cancelModal" class="secondary">Cancel</button><button class="primary">Save changes</button></div><div id="modalError" class="error"></div></form></dialog><dialog id="membersModal"><div class="modal-head"><h2 id="membersTitle">Project team</h2><button id="closeMembers" class="icon-btn" aria-label="Close project team">×</button></div><div id="membersContent"></div></dialog><div id="toast" role="status"></div>
<script src="/static/app.js"></script></body></html>
